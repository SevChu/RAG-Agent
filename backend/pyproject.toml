[project]
name = "agentic-backend"
version = "1.3.0"
description = "FastAPI backend for the local-first Agentic RAG agent platform"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.0,<2",
    "orjson>=3.11.9",
    "paddleocr==3.7.0",
    "psutil>=7.2.2",
    "paddlepaddle==3.3.1",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.0,<7",
    "pypdfium2>=5.0,<6",
    "qdrant-client>=1.15,<2",
    "sentence-transformers>=5.1,<6",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "torch==2.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
research = ["pyarrow>=18,<24", "scikit-learn>=1.9,<2"]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
